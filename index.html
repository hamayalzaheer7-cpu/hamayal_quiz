<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islamic Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="quiz-box">
        <p class="tag">KNOWLEDGE & FAITH</p>
        <h1>Islamic Quiz</h1>
        <p class="subtitle">Test your knowledge, one question at a time.</p>

        <p id="progress"></p>
        <h2 id="question"></h2>
        <div id="options"></div>

        <button id="nextBtn" onclick="nextQuestion()">Next Question →</button>

        <h3 id="result"></h3>

        <div class="history">
            <h3>Previous Results</h3>
            <div id="history"></div>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
